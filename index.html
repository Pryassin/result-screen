<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="./assets/images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="styles.css" />

    <title>Results Summary Component</title>
</head>
<body>
    <main class="results-summary-card">

        <section class="result-section">
            <h1 class="result-title">Your Result</h1>

            <div class="score-circle">
                <span class="score-number">76</span>
                <span class="score-total">of 100</span>
            </div>

            <h2 class="result-rating">Great</h2>

            <p class="result-description">
                You scored higher than 65% of the people who have taken these tests.
            </p>
        </section>

        <section class="summary-section">
            <h2 class="summary-title">Summary</h2>

            <ul class="summary-list">

                <li class="summary-item summary-item--reaction">
                    <div class="summary-category">
                        <img
                            src="./assets/images/icon-reaction.svg"
                            alt=""
                            aria-hidden="true"
                        >
                        <span>Reaction</span>
                    </div>

                    <div class="summary-score">
                        <span class="summary-score-value">80</span>
                        <span class="summary-score-max"> / 100</span>
                    </div>
                </li>

                <li class="summary-item summary-item--memory">
                    <div class="summary-category">
                        <img
                            src="./assets/images/icon-memory.svg"
                            alt=""
                            aria-hidden="true"
                        >
                        <span>Memory</span>
                    </div>

                    <div class="summary-score">
                        <span class="summary-score-value">92</span>
                        <span class="summary-score-max"> / 100</span>
                    </div>
                </li>

                <li class="summary-item summary-item--verbal">
                    <div class="summary-category">
                        <img
                            src="./assets/images/icon-verbal.svg"
                            alt=""
                            aria-hidden="true"
                        >
                        <span>Verbal</span>
                    </div>

                    <div class="summary-score">
                        <span class="summary-score-value">61</span>
                        <span class="summary-score-max"> / 100</span>
                    </div>
                </li>

                <li class="summary-item summary-item--visual">
                    <div class="summary-category">
                        <img
                            src="./assets/images/icon-visual.svg"
                            alt=""
                            aria-hidden="true"
                        >
                        <span>Visual</span>
                    </div>

                    <div class="summary-score">
                        <span class="summary-score-value">73</span>
                        <span class="summary-score-max"> / 100</span>
                    </div>
                </li>

            </ul>

            <button type="button" class="continue-button">
                Continue
            </button>
        </section>

    </main>
</body>
</html>
