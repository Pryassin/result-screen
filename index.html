<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Results summary component</title>
</head>
<body>

  <main class="card">
    <!-- Left Side: Overall Score -->
    <section class="result-section">
      <h1>Your Result</h1>

      <div class="score-circle">
        <span class="score-number">76</span>
        <span class="score-total">of 100</span>
      </div>

      <h2>Great</h2>
      <p>You scored higher than 65% of the people who have taken these tests.</p>
    </section>

    <!-- Right Side: Summary Breakdown -->
    <section class="summary-section">
      <h2>Summary</h2>

      <ul class="summary-list">
        <li class="summary-item reaction">
          <div class="category">
            <img src="./assets/images/icon-reaction.svg" alt="" aria-hidden="true">
            <span>Reaction</span>
          </div>
          <div class="score"><strong>80</strong> / 100</div>
        </li>

        <li class="summary-item memory">
          <div class="category">
            <img src="./assets/images/icon-memory.svg" alt="" aria-hidden="true">
            <span>Memory</span>
          </div>
          <div class="score"><strong>92</strong> / 100</div>
        </li>

        <li class="summary-item verbal">
          <div class="category">
            <img src="./assets/images/icon-verbal.svg" alt="" aria-hidden="true">
            <span>Verbal</span>
          </div>
          <div class="score"><strong>61</strong> / 100</div>
        </li>

        <li class="summary-item visual">
          <div class="category">
            <img src="./assets/images/icon-visual.svg" alt="" aria-hidden="true">
            <span>Visual</span>
          </div>
          <div class="score"><strong>73</strong> / 100</div>
        </li>
      </ul>

      <button type="button" class="continue-btn">Continue</button>
    </section>
  </main>

</body>
</html>
